[build]
  base = "Website"
  command = "npm run build"
  publish = "client/dist"
  functions = "server/netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["sqlite3"]
  included_files = ["server/db/eco_env.sqlite"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true
